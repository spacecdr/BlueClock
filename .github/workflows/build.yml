name: Build and test BlueClock
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Test clock logic
        run: |
          g++ -std=c++14 -fsanitize=address,undefined tests/clock_logic_test.cpp -o /tmp/blueclock-logic
          /tmp/blueclock-logic
      - name: Test display
        run: |
          g++ -std=c++14 -fsanitize=address,undefined tests/display_test.cpp -o /tmp/blueclock-display
          /tmp/blueclock-display
      - name: Check panel JavaScript
        run: node tools/check-panel.js
      - name: Build firmware
        run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: BlueClock-d1-mini
          path: .pio/build/d1_mini/firmware.bin
          if-no-files-found: error
